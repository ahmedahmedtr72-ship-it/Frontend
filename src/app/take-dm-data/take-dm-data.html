<div class="main-container"> 
  <div class="glass-card"> 
    <div class="card-header"> 
      <div class="icon-box"> 
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg> 
      </div> 
      <h2 class="logo-text">Générateur de PDF DM</h2> 
    </div> 
 
    <div class="form-content"> 
      <!-- Groupe GTIN --> 
      <div class="input-group"> 
        <label class="nav-section-title">Code GTIN</label> 
        <div class="input-wrapper"> 
          <input 
            type="text" 
            [(ngModel)]="gtin" 
            placeholder="4066447870138" 
            class="cyber-input mono"
            [disabled]="loading"
          /> 
        </div> 
      </div> 
 
      <!-- Groupe DATE --> 
      <div class="input-group"> 
        <label class="nav-section-title">Date de création</label> 
        <div class="input-wrapper"> 
          <input 
            type="date" 
            [(ngModel)]="date" 
            class="cyber-input"
            [disabled]="loading"
          /> 
        </div> 
      </div> 
 
      <!-- Bouton Action --> 
      <button  
        class="cyber-button"  
        (click)="downloadPdf()"  
        [disabled]="loading || !gtin || !date"
      > 
        <span class="btn-content" *ngIf="!loading"> 
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg> 
          Télécharger le PDF 
        </span> 
        <div class="spinner" *ngIf="loading"></div> 
        <span *ngIf="loading">Génération en cours...</span> 
      </button> 
    </div> 
  </div>

  <!-- Previous PDFs Section -->
  <div class="glass-card" *ngIf="previousPdfs.length > 0" style="margin-top: 2rem;">
    <div class="card-header">
      <div class="icon-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
        </svg>
      </div>
      <h2 class="logo-text">Historique des téléchargements</h2>
      <button class="clear-btn" (click)="clearHistory()" title="Effacer l'historique">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>
    </div>

    <div class="history-list">
      <div class="history-item" *ngFor="let pdf of previousPdfs">
        <div class="pdf-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
        </div>
        <div class="pdf-info">
          <div class="pdf-name">{{ pdf.filename }}</div>
          <div class="pdf-meta">
            <span>GTIN: {{ pdf.gtin }}</span>
            <span>Date: {{ pdf.date }}</span>
            <span>Téléchargé: {{ pdf.downloadedAt | date:'short' }}</span>
          </div>
        </div>
        <button class="redownload-btn" (click)="redownloadPdf(pdf)" title="Télécharger à nouveau">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
